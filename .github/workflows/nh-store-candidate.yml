name: NH Store candidate build
on:
  push:
    branches: ['hardening/pass13-store-candidate']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  store-candidate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare owned build workspace
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/pass13/profile,dist/pass13/tmp,dist/pass13/evidence | Out-Null
          foreach ($name in @('HOME','USERPROFILE','LOCALAPPDATA')) {
            "$name=$PWD/dist/pass13/profile" >> $env:GITHUB_ENV
          }
          foreach ($name in @('TEMP','TMP','TMPDIR','PIP_CACHE_DIR')) {
            "$name=$PWD/dist/pass13/tmp" >> $env:GITHUB_ENV
          }
          "PYTHONDONTWRITEBYTECODE=1" >> $env:GITHUB_ENV
          "HF_HUB_OFFLINE=1" >> $env:GITHUB_ENV
          "TRANSFORMERS_OFFLINE=1" >> $env:GITHUB_ENV
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Used,Free | ConvertTo-Json | Set-Content dist/pass13/evidence/disk-before.json
          git rev-parse HEAD 'HEAD^{tree}' | Set-Content dist/pass13/evidence/source-identity.txt
      - name: Install source-test dependencies
        shell: pwsh
        run: |
          python -m pip install ".[api,dev]" "Pillow==12.3.0" "psutil>=6,<8"
          if ($LASTEXITCODE -ne 0) { throw 'Source dependency installation failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Source dependency consistency failed' }
      - name: Packaging regression checks
        shell: pwsh
        run: |
          python -B -m pytest tests/test_store_packaging.py tests/test_feature_tiers.py tests/test_pass13_store_candidate.py --basetemp=dist/pass13/pytest --junitxml=dist/pass13/evidence/packaging-tests.xml -ra --tb=short
          if ($LASTEXITCODE -ne 0) { throw 'Packaging regression failed' }
      - name: Freeze, exercise, audit and seal the unsigned Store MSIX
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-msix.ps1 -RepoRoot $PWD -OutputRoot "$PWD/dist/pass13/store" -PackagingRoot "$PWD/dist/pass13/staging" -IdentityConfigPath store/msix/identity.example.json -FeatureTier essential -Unsigned
          if ($LASTEXITCODE -ne 0) { throw 'Store candidate build failed' }
      - name: Verify exact source publication boundary
        run: python scripts/run-public-source-preflight.py --index --require-ready --output dist/pass13/evidence/public-source-index.json
      - name: Preserve candidate and compact build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nh-store-candidate-${{ github.sha }}
          path: |
            dist/pass13/store/msix/*.msix
            dist/pass13/store/evidence/*.json
            dist/pass13/store/evidence/*.txt
            dist/pass13/store/evidence/*.log
            dist/pass13/evidence/*
            dist/build-cache/tesseract/5.5.0.20241111/receipt.json
          if-no-files-found: error
          retention-days: 14
