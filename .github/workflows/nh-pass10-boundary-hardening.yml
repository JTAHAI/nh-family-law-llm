name: NH Pass 10 boundary hardening
on:
  push:
    branches: [master, 'hardening/pass10-*']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  boundary-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare repository-owned synthetic workspace
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path.cwd() / 'dist' / 'pass10-boundary'
          paths = {
              'HOME': 'profile', 'USERPROFILE': 'profile',
              'LOCALAPPDATA': 'profile', 'TEMP': 'tmp', 'TMP': 'tmp',
              'TMPDIR': 'tmp', 'PIP_CACHE_DIR': 'cache',
              'NHFL_VAULT_KEY_ROOT': 'profile/vault',
              'NHFL_IDEMPOTENCY_STATE_ROOT': 'profile/idempotency',
          }
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, leaf in paths.items():
                  path = root / leaf
                  path.mkdir(parents=True, exist_ok=True)
                  output.write(f'{key}={path}\n')
              output.write('PYTHONDONTWRITEBYTECODE=1\n')
              output.write('HF_HUB_OFFLINE=1\nTRANSFORMERS_OFFLINE=1\n')
      - name: Install declared dependencies and synthetic fixtures
        run: >-
          python -m pip install
          ".[api,dev]"
          "fpdf2>=2.8,<3"
          "Pillow>=12.3,<13"
          "jsonschema>=4,<5"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Record resolved dependencies
        run: python -m pip list --format=json > dist/pass10-boundary/dependencies.json
      - name: Run request and external-root regressions
        run: >-
          python -m pytest
          tests/test_pass10_boundary_inputs.py
          tests/test_v602_final_hardening.py
          tests/test_pass06_regression_closure.py
          tests/test_v640_eval_review_studio.py
          --basetemp=dist/pass10-boundary/pytest
          --junitxml=dist/pass10-boundary/results.xml
          -ra --tb=short
      - name: Verify exact staged source after tests
        if: ${{ !cancelled() }}
        run: >-
          python scripts/run-public-source-preflight.py
          --index --require-ready
          --output dist/pass10-boundary/public-source-index.json
      - name: Preserve compact engineering evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nh-pass10-boundary-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/pass10-boundary/results.xml
            dist/pass10-boundary/dependencies.json
            dist/pass10-boundary/public-source-index.json
          retention-days: 14
          if-no-files-found: warn
