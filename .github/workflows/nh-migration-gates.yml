name: NH migration gates
on:
  push:
  pull_request:
jobs:
  nh-source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify_pass_03.py
      - run: python -m compileall -q src tests
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_pass_03_ui_runtime_protocol.py
      - run: python scripts/smoke_nh_source_journey.py
