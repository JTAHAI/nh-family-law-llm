name: NH Pass 12 declared DOCX dependency
on:
  push:
    branches: ['hardening/pass12-docx-qualification']
    paths: ['.github/workflows/nh-pass12-dependency-transfer.yml']
permissions:
  contents: read
jobs:
  dependency-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download declared dependency only, without installation
        run: >-
          python -m pip download --no-cache-dir --no-deps --only-binary=:all:
          --dest dist/pass12-dependency docx-editor==0.7.1
      - name: Verify official release digest
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          root = Path('dist/pass12-dependency')
          wheel = root / 'docx_editor-0.7.1-py3-none-any.whl'
          actual = hashlib.sha256(wheel.read_bytes()).hexdigest()
          expected = 'da7e11d8a4f5dc0fddcdd183e42b36ec01de7f626f3c445782cc5548a947d520'
          if actual != expected:
              raise SystemExit('DOCX dependency release digest mismatch')
          (root / 'receipt.json').write_text(json.dumps({
              'package': 'docx-editor', 'version': '0.7.1', 'sha256': actual,
              'source': 'https://pypi.org/project/docx-editor/0.7.1/',
              'installed': False, 'legal_review_verified': False}, indent=2), encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: nh-pass12-declared-docx-dependency
          path: dist/pass12-dependency/
          retention-days: 3
          if-no-files-found: error
