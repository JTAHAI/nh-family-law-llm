name: NH Pass 10 reconciliation source
on:
  push:
    branches: ['hardening/pass10-reconcile-source']
    paths: ['.github/workflows/nh-pass10-reconcile-source.yml']
permissions:
  contents: read
jobs:
  source-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact tracked Git objects
        run: |
          mkdir -p dist/pass10-reconcile
          git bundle create dist/pass10-reconcile/source.bundle HEAD
          git bundle verify dist/pass10-reconcile/source.bundle
          git rev-parse HEAD HEAD^{tree} > dist/pass10-reconcile/source-identity.txt
          sha256sum dist/pass10-reconcile/source.bundle > dist/pass10-reconcile/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nh-pass10-reconcile-source-${{ github.sha }}
          path: dist/pass10-reconcile/
          if-no-files-found: error
          retention-days: 3
