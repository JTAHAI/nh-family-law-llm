name: NH Pass 09 evidence and service hardening
on:
  push:
    branches: [master, 'hardening/pass09-*']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  focused-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare repository-owned synthetic workspace
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path.cwd() / 'dist' / 'pass09-ci'
          paths = {
              'HOME': 'profile', 'USERPROFILE': 'profile',
              'LOCALAPPDATA': 'profile', 'TEMP': 'tmp', 'TMP': 'tmp',
              'TMPDIR': 'tmp', 'PIP_CACHE_DIR': 'cache',
              'NHFL_VAULT_KEY_ROOT': 'profile/vault',
          }
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, leaf in paths.items():
                  path = root / leaf
                  path.mkdir(parents=True, exist_ok=True)
                  output.write(f'{key}={path}\n')
              output.write('PYTHONDONTWRITEBYTECODE=1\n')
              output.write('HF_HUB_OFFLINE=1\nTRANSFORMERS_OFFLINE=1\n')
      - name: Install declared dependencies and synthetic fixtures
        run: >-
          python -m pip install
          ".[api,dev]"
          "fpdf2>=2.8,<3"
          "Pillow>=12.3,<13"
          "jsonschema>=4,<5"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Record resolved dependencies
        run: python -m pip list --format=json > dist/pass09-ci/dependencies.json
      - name: Run freshness, evidence-runner, API, and no-overclaim regressions
        run: >-
          python -m pytest
          tests/test_pass31_staleness_jurisdiction_metric_gate.py
          tests/test_pass32_38_engineering_closure.py
          tests/test_pass39_pass40_api_ui_completion.py
          tests/test_pass41_pass42_model_governance_injection_defense.py
          --basetemp=dist/pass09-ci/pytest-core
          --junitxml=dist/pass09-ci/results-core.xml
          -ra --tb=short
      - name: Run protected deliberation service regressions in an isolated process
        run: >-
          python -m pytest
          tests/test_pass01_deliberation_startup.py
          tests/test_deliberation_workspace.py
          tests/test_pass02_provider_storage.py
          --basetemp=dist/pass09-ci/pytest-deliberation
          --junitxml=dist/pass09-ci/results-deliberation.xml
          -ra --tb=short
      - name: Run canonical form and reviewer-workbench regressions
        run: >-
          python -m pytest
          tests/test_pass81_guided_forms_acceptance.py
          tests/test_v5110_nh_findings_forms_workbench.py
          tests/test_v580_reviewer_queue_procedure_forms_annotations.py
          --basetemp=dist/pass09-ci/pytest-forms
          --junitxml=dist/pass09-ci/results-forms.xml
          -ra --tb=short
      - name: Run GA-evidence fail-closed and release-hygiene regressions
        run: >-
          python -m pytest
          tests/test_ga_pass_evidence_gate.py
          tests/test_ga_pass_tracker.py
          tests/test_ga_tracker_integrity_hardening.py
          tests/test_pass39_pass40_true_ga_closure.py
          tests/test_pass43_pass45_ga_evidence_closure.py
          tests/test_release_artifact_hygiene_pass.py
          --basetemp=dist/pass09-ci/pytest-ga-release
          --junitxml=dist/pass09-ci/results-ga-release.xml
          -ra --tb=short
      - name: Verify exact staged source after tests
        run: >-
          python scripts/run-public-source-preflight.py
          --index --require-ready
          --output dist/pass09-ci/public-source-index.json
      - name: Preserve compact engineering evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nh-pass09-evidence-service-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/pass09-ci/results-*.xml
            dist/pass09-ci/dependencies.json
            dist/pass09-ci/public-source-index.json
          retention-days: 14
          if-no-files-found: warn
