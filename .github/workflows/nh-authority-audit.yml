
name: NH authority audit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/audit_nh_authorities.py
      - run: python scripts/scan_for_maine_authority.py
      - run: python -m pytest tests/test_nh_authority_manifest.py -q
