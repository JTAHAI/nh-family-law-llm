
name: NH authority audit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare repository-owned test workspace
        run: |
          mkdir -p dist/authority-ci/tmp dist/authority-ci/profile
          echo "TMPDIR=$GITHUB_WORKSPACE/dist/authority-ci/tmp" >> "$GITHUB_ENV"
          echo "HOME=$GITHUB_WORKSPACE/dist/authority-ci/profile" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
      - name: Install declared test dependencies
        run: python -m pip install ".[dev]"
      - run: python -m pip check
      - run: python scripts/audit_nh_authorities.py
      - run: python scripts/scan_for_maine_authority.py
      - run: python -m pytest tests/test_nh_authority_manifest.py --basetemp=dist/authority-ci/pytest --junitxml=dist/authority-ci/results.xml -ra --tb=short
      - name: Preserve authority engineering test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nh-authority-ci-${{ github.sha }}
          path: dist/authority-ci/results.xml
          retention-days: 14
