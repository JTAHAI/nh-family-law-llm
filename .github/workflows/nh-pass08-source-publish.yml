name: NH Pass 08 verified source publication
on:
  push:
    branches: ['hardening/pass08-memory-regressions']
    paths: ['.github/workflows/nh-pass08-source-publish.yml']
permissions:
  contents: write
jobs:
  verified-source:
    if: github.repository == 'JTAHAI/nh-family-law-llm' && github.ref == 'refs/heads/hardening/pass08-memory-regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare owned environment and verify exact patch
        shell: python
        run: |
          import base64, hashlib, json, os, shutil, subprocess, zlib
          from pathlib import Path
          root = Path.cwd()
          work = root / 'dist/pass08-publish'
          work.mkdir(parents=True, exist_ok=True)
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs).decode().strip()
          if git('rev-parse', 'HEAD^') != 'b02e9d29287f9a422a751f76f1378dacf0ec384b':
              raise SystemExit('Unexpected publication base')
          if git('status', '--porcelain'):
              raise SystemExit('Checkout is not clean')
          chunks = [Path(f'.github/pass08-transfer-{i}.txt') for i in range(4)]
          encoded = ''.join(path.read_text(encoding='utf-8') for path in chunks)
          if len(encoded) != 11232:
              raise SystemExit('Patch transport length mismatch')
          decoder = zlib.decompressobj()
          patch = decoder.decompress(base64.b64decode(encoded, validate=True), 36426)
          if not decoder.eof or decoder.unused_data or decoder.unconsumed_tail or len(patch) != 36425:
              raise SystemExit('Patch expansion mismatch')
          if hashlib.sha256(patch).hexdigest() != 'e03a0110fe537f3d626e8ae45b5d5f25f04704c549e69957a5ee5ad1f220ca8f':
              raise SystemExit('Patch digest mismatch')
          path = work / 'source.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          candidate = work / 'candidate.index'
          shutil.copyfile(root / '.git/index', candidate)
          env = dict(os.environ, GIT_INDEX_FILE=str(candidate))
          temporary = ['.github/workflows/nh-pass08-source-publish.yml', *map(str, chunks)]
          subprocess.run(['git', 'update-index', '--force-remove', *temporary], env=env, check=True)
          tree = git('write-tree', env=env)
          if tree != 'e33233914b905b641525b0e55169f05e274f9372':
              raise SystemExit('Complete candidate tree mismatch')
          (work / 'identity.json').write_text(json.dumps({'base': git('rev-parse', 'HEAD^'),
              'candidate_tree': tree, 'patch_sha256': hashlib.sha256(patch).hexdigest(),
              'production_ready': False, 'legal_review_verified': False}), encoding='utf-8')
          paths = {'HOME':'profile', 'USERPROFILE':'profile', 'LOCALAPPDATA':'profile',
                   'TEMP':'tmp', 'TMP':'tmp', 'TMPDIR':'tmp', 'PIP_CACHE_DIR':'cache',
                   'NHFL_VAULT_KEY_ROOT':'profile/vault'}
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, leaf in paths.items():
                  value = work / leaf
                  value.mkdir(parents=True, exist_ok=True)
                  output.write(f'{key}={value}\n')
              output.write('PYTHONDONTWRITEBYTECODE=1\nHF_HUB_OFFLINE=1\nTRANSFORMERS_OFFLINE=1\n')
      - name: Install unchanged declared dependencies
        run: python -m pip install '.[api,dev]' 'fpdf2>=2.8,<3' 'Pillow>=12.3,<13' 'jsonschema>=4,<5'
      - run: python -m pip check
      - name: Verify memory and authority repairs before publication
        run: >-
          python -B -m pytest
          tests/test_pass08_memory_consumers.py
          tests/test_pass08_authority_identity.py
          tests/test_pass19_authority_execution_harness.py
          tests/test_pass30_authority_gap_vertical.py
          tests/test_pass35_parser_regression_corpus.py
          tests/test_pass37_forms_catalog_synchronizer.py
          tests/test_fast_interchange_host_source_binding.py
          tests/test_pass06_authority_root_binding.py
          --basetemp=dist/pass08-publish/pytest
          --junitxml=dist/pass08-publish/results.xml -ra --tb=short
      - name: Audit final candidate and publish source without forcing history
        shell: python
        run: |
          import json, os, subprocess, sys
          from pathlib import Path
          work = Path.cwd() / 'dist/pass08-publish'
          env = dict(os.environ, GIT_INDEX_FILE=str(work / 'candidate.index'))
          subprocess.run([sys.executable, 'scripts/run-public-source-preflight.py', '--index',
              '--require-ready', '--output', str(work / 'public-source-index.json')], env=env, check=True)
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Pass 08: close memory consumers and bind authority product roots'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/hardening/pass08-memory-regressions'], check=True)
          receipt = json.loads((work / 'identity.json').read_text())
          receipt['published_source_commit'] = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          (work / 'identity.json').write_text(json.dumps(receipt), encoding='utf-8')
      - name: Preserve compact verification evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nh-pass08-source-publication-${{ github.sha }}
          path: |
            dist/pass08-publish/identity.json
            dist/pass08-publish/results.xml
            dist/pass08-publish/public-source-index.json
          retention-days: 14
          if-no-files-found: warn
