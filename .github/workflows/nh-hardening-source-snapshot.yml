name: NH hardening source snapshot
on:
  push:
    branches: [hardening/pass01-vault-storage]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          available_kb=$(df -Pk . | awk 'NR==2 {print $4}')
          test "$available_kb" -gt 262144
          mkdir -p dist/pass01/source-snapshot
          git archive --format=zip --prefix=nh-family-law-llm/ --output=dist/pass01/source-snapshot/nh-source.zip HEAD
          git rev-parse HEAD > dist/pass01/source-snapshot/SOURCE_COMMIT.txt
          (cd dist/pass01/source-snapshot && sha256sum nh-source.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: nh-hardening-source-${{ github.sha }}
          path: dist/pass01/source-snapshot/
          if-no-files-found: error
          retention-days: 3
