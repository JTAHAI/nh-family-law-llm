name: NH desktop source and wheel qualification
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TMPDIR: ${{ github.workspace }}/dist/ci-tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: mkdir -p dist/ci-tmp dist/wheels
      - run: python -m pip install build wheel '.[api,dev]'
      - run: python -m pip check
      - run: python -m pytest tests/test_pass08_desktop_release.py tests/test_pass07_nh_evaluation_hardening.py tests/test_pass06_nh_legal_behavior.py --basetemp=dist/ci-pytest -ra
      - run: python scripts/qualify_nh_desktop.py
      - run: python -m build --wheel --outdir dist/wheels
      - run: python scripts/verify_pass_08.py --wheel dist/wheels/nh_family_law_llm-8.0.10-py3-none-any.whl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nh-pass08-source-evidence
          path: artifacts/pass-08
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - shell: pwsh
        run: ./scripts/windows/qualify-pass-08.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nh-pass08-windows-evidence
          path: |
            artifacts/pass-08/windows-host.json
            dist/pass08-host/*.log
            dist/pass08-host/installed-journey.json
