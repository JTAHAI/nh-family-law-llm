name: NH Pass 07 source transfer
on:
  push:
    branches: ['hardening/pass07-fast-interchange-model-pack']
    paths: ['.github/workflows/nh-pass07-source-transfer.yml']
permissions:
  contents: read
jobs:
  source-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact tracked Git objects
        run: |
          mkdir -p dist/pass07-transfer
          git bundle create dist/pass07-transfer/source.bundle HEAD
          git bundle verify dist/pass07-transfer/source.bundle
          git rev-parse HEAD HEAD^{tree} > dist/pass07-transfer/source-identity.txt
          sha256sum dist/pass07-transfer/source.bundle > dist/pass07-transfer/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nh-pass07-tracked-source-${{ github.sha }}
          path: dist/pass07-transfer/
          if-no-files-found: error
          retention-days: 3
