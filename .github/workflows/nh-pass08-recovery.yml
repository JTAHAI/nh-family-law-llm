name: NH Pass 08 source recovery
on:
  push:
    branches: ['hardening/pass08-memory-regressions']
    paths: ['.github/workflows/nh-pass08-recovery.yml']
permissions:
  contents: read
jobs:
  source-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked Git objects only
        run: |
          mkdir -p dist/pass08-recovery
          git bundle create dist/pass08-recovery/source.bundle HEAD
          git bundle verify dist/pass08-recovery/source.bundle
          git rev-parse HEAD HEAD^{tree} > dist/pass08-recovery/source-identity.txt
          sha256sum dist/pass08-recovery/source.bundle > dist/pass08-recovery/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nh-pass08-recovered-source-${{ github.sha }}
          path: dist/pass08-recovery/
          if-no-files-found: error
          retention-days: 3
