name: NH storage hardening
on:
  push:
    branches: [master, 'hardening/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  storage-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare repository-owned synthetic workspace
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path.cwd() / 'dist' / 'storage-hardening'
          paths = {'HOME': 'profile', 'USERPROFILE': 'profile',
                   'LOCALAPPDATA': 'profile', 'TEMP': 'tmp', 'TMP': 'tmp',
                   'TMPDIR': 'tmp', 'PIP_CACHE_DIR': 'cache'}
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, leaf in paths.items():
                  path = root / leaf
                  path.mkdir(parents=True, exist_ok=True)
                  output.write(f'{key}={path}\n')
              output.write('PYTHONDONTWRITEBYTECODE=1\n')
      - name: Install declared dependencies and PDF test fixtures
        run: python -m pip install ".[api,dev]" "fpdf2>=2.8,<3" "Pillow>=12.3,<13" "setuptools>=69" "jsonschema>=4,<5" build wheel
      - name: Check dependency consistency
        run: python -m pip check
      - name: Record dependency versions
        run: python -m pip list --format=json > dist/storage-hardening/dependencies.json
      - name: Vault, boundary, preview, local-agent and startup regressions
        run: >-
          python -m pytest
          tests/test_pass05_fixture_contracts.py
          tests/test_cli_api_local_v1.py
          tests/test_compound_claim_filing_boundary.py
          tests/test_enterprise_resource_collection.py
          tests/test_external_audit_cli_fail_closed.py
          tests/test_pass04_wheel_integrity.py
          tests/test_pass04_model_boundary.py
          tests/test_pass04_packaging_checkout.py
          tests/test_v650_local_intelligence_control_center.py
          tests/test_v652_local_intelligence_governance.py
          tests/test_adaptive_local_runtime.py
          tests/test_production_api_gateway.py
          tests/test_pass08_desktop_release.py
          tests/test_pass07_nh_evaluation_hardening.py
          tests/test_pass06_nh_legal_behavior.py
          tests/test_canonical_document_model.py
          tests/test_retrieval_stack_pass5.py
          tests/test_v510_knowledge_bundle.py
          tests/test_pass03_chat_quarantine.py
          tests/test_pass03_ci_contract.py
          tests/test_production_authority_lane_boundary.py
          tests/test_pass02_provider_storage.py
          tests/test_pass02_index_preflight.py
          tests/test_provider_connections.py
          tests/test_public_source_pre_push_gate_v191.py
          tests/test_release_audits_read_only.py
          tests/test_pass01_vault_storage_hardening.py
          tests/test_pass01_deliberation_startup.py
          tests/test_matter_vault_encryption.py
          tests/test_pdf_raster_preview.py
          tests/test_v540_local_agent_runtime.py
          tests/test_v540_local_agent_api_ui.py
          tests/test_deliberation_workspace.py
          --basetemp=dist/storage-hardening/pytest
          --junitxml=dist/storage-hardening/results.xml
          -ra --tb=short
      - name: Verify exact staged source without deleting test artifacts
        run: python scripts/run-public-source-preflight.py --index --require-ready --output dist/storage-hardening/public-source-index.json
      - name: Build wheel in repository-owned intermediates
        run: >-
          python -c "from setuptools import setup; setup(script_args=['egg_info','--egg-base','dist/storage-hardening','build','--build-base','dist/storage-hardening/build','bdist_wheel','--bdist-dir','dist/storage-hardening/bdist','--dist-dir','dist/storage-hardening/wheels'])"
      - name: Install and exercise the exact wheel independently of checkout imports
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          root = Path.cwd()
          work = root / 'dist' / 'storage-hardening'
          wheels = list((work / 'wheels').glob('nh_family_law_llm-*.whl'))
          if len(wheels) != 1:
              raise SystemExit('Exactly one candidate wheel is required')
          wheel = wheels[0]
          subprocess.check_call([sys.executable, 'scripts/verify_pass_08.py', '--wheel', str(wheel),
                                 '--output', str(work / 'wheel-source-gate.json')])
          venv = work / 'installed-venv'
          subprocess.check_call([sys.executable, '-m', 'venv', str(venv)])
          python = venv / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.check_call([str(python), '-m', 'pip', 'install', str(wheel) + '[api]'])
          subprocess.check_call([str(python), '-m', 'pip', 'check'])
          with (work / 'installed-dependencies.json').open('w', encoding='utf-8') as output:
              subprocess.check_call([str(python), '-m', 'pip', 'list', '--format=json'], stdout=output)
          subprocess.check_call([sys.executable, 'scripts/qualify_nh_desktop.py',
                                 '--installed', '--wheel', str(wheel), '--python', str(python),
                                 '--work-dir', str(work / 'installed-journey'),
                                 '--output', str(work / 'installed-journey.json')])
      - name: Preserve compact engineering evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nh-storage-hardening-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/storage-hardening/results.xml
            dist/storage-hardening/dependencies.json
            dist/storage-hardening/public-source-index.json
            dist/storage-hardening/wheel-source-gate.json
            dist/storage-hardening/installed-journey.json
            dist/storage-hardening/installed-dependencies.json
          if-no-files-found: warn
          retention-days: 14
