name: CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master, 'hardening/**']
permissions:
  contents: read
jobs:
  hygiene-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare repository-owned test workspace
        run: |
          mkdir -p dist/ci/tmp dist/ci/profile dist/ci/cache
          echo "TMPDIR=$GITHUB_WORKSPACE/dist/ci/tmp" >> "$GITHUB_ENV"
          echo "HOME=$GITHUB_WORKSPACE/dist/ci/profile" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$GITHUB_WORKSPACE/dist/ci/cache" >> "$GITHUB_ENV"
          echo "NHFL_VAULT_KEY_ROOT=$GITHUB_WORKSPACE/dist/ci/profile/vault" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
      - name: Install declared API and test dependencies
        run: python -m pip install ".[api,dev]" "fpdf2>=2.8,<3" "Pillow>=12.3,<13"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Source snapshot gate including doctor-local-repo.py
        run: python scripts/run-public-source-preflight.py --repo-root . --index --require-ready --output dist/ci/public-source-index.json
      - name: Offline dependency floor gate
        run: python scripts/check-dependency-security.py --strict-optional
      - name: Current advisory audit
        run: python -m pip_audit .
      - name: Quality-check command contract
        run: python -m py_compile scripts/run-quality-checks.py
      - name: Chat library evidence
        run: python scripts/run-chat-library-evidence.py --require-ready --output dist/ci/chat-library.json
      - name: Targeted tests
        run: >-
          python -m pytest -q
          tests/test_answering_pipeline_guardrails.py
          tests/test_canonical_document_model.py
          tests/test_retrieval_stack_pass5.py
          tests/test_matter_ingestion_pass9.py
          tests/test_chat_library_v187_input_clear_and_routing.py
          tests/test_pass48_51_launch_evidence_gates.py
          tests/test_pass48_51_launch_evidence_starter_kit.py
          tests/test_enterprise_release_control_v206.py
          tests/test_attorney_sandbox_review_kit_v193.py
          tests/test_public_source_pre_push_gate_v191.py
          tests/test_git_safe_push_v192.py
          tests/test_v510_dependency_security.py
          tests/test_v510_workflow_skill_registry.py
          tests/test_v510_matter_inventory_and_classification.py
          tests/test_v510_cross_document_consistency.py
          tests/test_v510_independent_qc_contract.py
          tests/test_v510_knowledge_bundle.py
          tests/test_v510_docx_media_and_skill_package.py
          tests/test_v510_ingestion_integration.py
          --basetemp=dist/ci/pytest
          --junitxml=dist/ci/results.xml
          -ra --tb=short
      - name: Preserve compact CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nh-general-ci-${{ github.sha }}
          path: |
            dist/ci/public-source-index.json
            dist/ci/chat-library.json
            dist/ci/results.xml
          if-no-files-found: warn
          retention-days: 14
