name: NH Pass 05 source transfer
on:
  push:
    branches: ['hardening/pass05-regression-sync']
    paths: ['.github/workflows/nh-pass05-source-transfer.yml']
permissions:
  contents: read
jobs:
  source-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked Git objects only
        run: |
          mkdir -p dist/pass05-transfer
          git bundle create dist/pass05-transfer/source.bundle HEAD
          git bundle verify dist/pass05-transfer/source.bundle
          git rev-parse HEAD HEAD^{tree} > dist/pass05-transfer/source-identity.txt
          sha256sum dist/pass05-transfer/source.bundle > dist/pass05-transfer/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nh-pass05-tracked-source-${{ github.sha }}
          path: dist/pass05-transfer/
          if-no-files-found: error
          retention-days: 3
