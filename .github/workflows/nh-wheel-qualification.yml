name: NH exact wheel qualification
on:
  push:
    branches: [master, 'hardening/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  installed-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare repository-owned synthetic workspace
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path.cwd() / 'dist' / 'wheel-ci'
          paths = {'HOME': 'profile', 'USERPROFILE': 'profile',
                   'LOCALAPPDATA': 'profile', 'TEMP': 'tmp', 'TMP': 'tmp',
                   'TMPDIR': 'tmp', 'PIP_CACHE_DIR': 'cache',
                   'NHFL_VAULT_KEY_ROOT': 'profile/vault'}
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, leaf in paths.items():
                  path = root / leaf
                  path.mkdir(parents=True, exist_ok=True)
                  output.write(f'{key}={path}\n')
              output.write('PYTHONDONTWRITEBYTECODE=1\n')
      - name: Install declared source and build dependencies
        run: python -m pip install '.[api,dev]' 'setuptools>=69' 'jsonschema>=4,<5' build wheel
      - name: Check source dependency consistency
        run: python -m pip check
      - name: Desktop and integrity regressions
        run: >-
          python -m pytest
          tests/test_pass04_wheel_integrity.py
          tests/test_pass08_desktop_release.py
          tests/test_pass07_nh_evaluation_hardening.py
          tests/test_pass06_nh_legal_behavior.py
          --basetemp=dist/wheel-ci/pytest
          --junitxml=dist/wheel-ci/source-tests.xml
          -ra --tb=short
      - name: Build using declared setuptools backend with owned intermediates
        shell: python
        run: |
          from pathlib import Path
          from setuptools import setup
          work = Path('dist/wheel-ci').absolute()
          for leaf in ('metadata', 'build', 'bdist', 'wheels'):
              (work / leaf).mkdir(exist_ok=True)
          setup(script_args=[
              'egg_info', '--egg-base', str(work / 'metadata'),
              'build', '--build-base', str(work / 'build'),
              'bdist_wheel', '--bdist-dir', str(work / 'bdist'),
              '--dist-dir', str(work / 'wheels')])
      - name: Source to wheel integrity and isolated install
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          root = Path.cwd()
          work = root / 'dist/wheel-ci'
          wheels = list((work / 'wheels').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit('Exactly one candidate wheel is required')
          wheel = wheels[0]
          subprocess.run([sys.executable, 'scripts/verify_pass_08.py', '--wheel', str(wheel),
              '--output', str(work / 'source-wheel.json')], check=True)
          venv = work / 'installed-venv'
          subprocess.run([sys.executable, '-m', 'venv', str(venv)], check=True)
          python = venv / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(python), '-m', 'pip', 'install', str(wheel) + '[api]'], check=True)
          subprocess.run([str(python), '-m', 'pip', 'check'], check=True)
          with (work / 'installed-dependencies.json').open('w', encoding='utf-8') as output:
              subprocess.run([str(python), '-m', 'pip', 'list', '--format=json'], stdout=output, check=True)
          subprocess.run([sys.executable, 'scripts/qualify_nh_desktop.py', '--installed',
              '--wheel', str(wheel), '--python', str(python),
              '--work-dir', str(work / 'journey'), '--output', str(work / 'installed-journey.json')], check=True)
      - name: Verify exact publication tree after qualification
        run: python scripts/run-public-source-preflight.py --index --require-ready --output dist/wheel-ci/public-source-index.json
      - name: Preserve compact qualification evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nh-exact-wheel-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/wheel-ci/source-tests.xml
            dist/wheel-ci/source-wheel.json
            dist/wheel-ci/installed-journey.json
            dist/wheel-ci/installed-dependencies.json
            dist/wheel-ci/public-source-index.json
          retention-days: 14
          if-no-files-found: warn
